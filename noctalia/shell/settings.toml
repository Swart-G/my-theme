config_version = 16

[bar.default]
end = ["tray", "bar", "notifications", "network", "volume", "battery", "keyboard_layout"]
start = ["control-center", "workspaces"]
widget_spacing = 10

[control_center.calendar]
show_events_card = false

[lockscreen_widgets]
enabled = false
schema_version = 2

[plugins]
enabled = ["raycursive/discord-voice"]

[widget.bar]
type = "raycursive/discord-voice:bar"

[widget.tray]
drawer = true
