[shell]
lang = "ru"
font_family = "Adwaita Sans"
setup_wizard_enabled = false
settings_show_advanced = true
polkit_agent = true
clipboard_enabled = true
launch_apps_as_systemd_services = true

[shell.panel]
control_center_placement = "attached"
control_center_position = "auto"
launcher_placement = "floating"
launcher_position = "center"

[theme]
mode = "dark"

# Pin the current notification appearance instead of relying on built-in defaults.
[notification]
enable_daemon = true
position = "top_right"
layer = "top"
width = 360
scale = 1.0
offset_x = 20
offset_y = 8
background_opacity = 0.97
border = true
border_color = "outline_variant"
border_width = 1.0
show_actions = true
show_app_name = true
follow_focused_output = false
monitors = []
max_visible = 0
collapse_on_dismiss = true
keep_dismissed_in_history = true
history_retention_hours = 0

[osd]
enabled = true
position = "top_center"
position_vertical = "top_center"
orientation = "horizontal"
scale = 1.0
offset_x = 20
offset_y = 8
background_opacity = 0.97
border = true
border_color = "outline_variant"
border_width = 1.0
hide_delay_ms = 1400
follow_focused_output = false
monitors = []

[bar.default]
position = "left"
thickness = 48
margin_edge = 0
margin_ends = 0
padding = 8
widget_spacing = 6
background_opacity = 0.96
radius = 12
concave_edge_corners = false
radius_top_left = 0
radius_bottom_left = 0
radius_top_right = 12
radius_bottom_right = 12
reserve_space = true
start = ["launcher", "workspaces"]
center = ["clock"]
end = ["tray", "keyboard_layout", "notifications", "volume", "network", "bluetooth", "battery", "control-center", "settings"]

[wallpaper]
enabled = true
fill_mode = "crop"
transition_on_startup = false

[wallpaper.default]
path = "@CONFIG@/niri/wallpaper-city.jpg"

[dock]
enabled = false

[idle.behavior.lock]
enabled = true
timeout = 600
action = "lock"

[idle.behavior.screen-off]
enabled = true
timeout = 900
action = "screen_off"

[shell.launcher]
fetch_exchange_rates = false

[lockscreen]
transition = ["fade"]
transition_duration = 250
lock_before_suspend = true
